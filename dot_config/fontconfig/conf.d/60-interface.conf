<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Interface fonts. Kept apart from ../fonts.conf, which `omarchy font set`
  rewrites with only the monospace font.

  Strong bindings beat Omarchy's soft preference for Liberation Sans
  (/usr/share/fontconfig/conf.avail/50-omarchy.conf). "prepend" inserts Inter
  where the generic name is, so a font an app or web page names before it
  still comes first.

  sans-serif and serif are set in /etc/fonts/conf.d/49-carmine-fonts.conf:
  Omarchy replaces those names before user configuration is read.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>

  <alias>
    <family>ui-monospace</family>
    <default><family>monospace</family></default>
  </alias>

  <alias>
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias>
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
</fontconfig>
