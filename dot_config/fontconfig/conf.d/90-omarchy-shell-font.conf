<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The Omarchy shell (Quickshell) draws everything in the "monospace" alias,
  the same font as the terminals. This rule gives the shell its own face and
  leaves every other program alone.

  assign_replace swaps out the whole family list, so the rule `omarchy font
  set` writes to ../fonts.conf (read after this directory) no longer sees
  "monospace" and cannot take the shell back. JetBrainsMono Nerd Font comes
  second for the Nerd Font icons the shell draws, which IBM Plex Sans lacks.

  Keep a face with equal-width digits here, or the clock and stats change
  width as they update. IBM Plex Sans has them. Inter and Geist only do when
  an app asks for tnum, and Qt ignores fontconfig's fontfeatures.
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>IBM Plex Sans</string>
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>
</fontconfig>
