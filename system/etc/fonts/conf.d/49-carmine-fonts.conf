<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Carmine's default sans-serif and serif fonts. Loaded before
  50-omarchy.conf, which replaces these generic names with Liberation Sans and
  Liberation Serif before any user configuration is read. "prepend" with a
  strong binding puts the choice where the generic name is, so a font an app
  or document names explicitly still comes first.
  system-ui is set in ~/.config/fontconfig/conf.d/60-interface.conf.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif</string></edit>
  </match>
</fontconfig>
